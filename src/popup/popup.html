<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taptop Toolkit</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M8 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4"/></svg>
        </span>
        <span>Taptop Toolkit</span>
      </header>
      <p class="lead">Импортирует секции, страницы и целые сайты в Taptop из JSON-файла.</p>
      <section class="hint" aria-labelledby="hint-title">
        <span class="mini-editor" aria-hidden="true">
          <span class="mini-launcher"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m8 11 4 4 4-4"/><path d="M8 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-4"/></svg></span>
          <span class="mini-help"></span>
        </span>
        <div>
          <h1 class="hint-title" id="hint-title">Где найти импорт</h1>
          <p class="hint-text">Откройте проект в редакторе Taptop — синяя кнопка будет справа внизу.</p>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
